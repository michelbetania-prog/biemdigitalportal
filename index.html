<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4B0082" />
    <meta name="description" content="Portal de clientes BIEM — estrategia, entregables y resultados en un solo lugar." />
    <title>BIEM — Portal cliente</title>
    <link rel="stylesheet" href="/src/styles.css">
    <link rel="stylesheet" href="/src/admin-styles.css">
    <link rel="stylesheet" href="/src/biem-theme.css">
    <script src="/config.js"></script>
    <script>
      (() => {
        const showStartupFallback = error => {
          const root = document.getElementById('root')
          if (!root || root.childNodes.length) return
          root.innerHTML = '<main class="runtime-error-boundary"><h1>No pudimos mostrar esta pantalla</h1><p>Ocurrió un error inesperado al cargar el portal. Recarga la página o contacta al administrador.</p><pre></pre><button type="button">Recargar</button></main>'
          root.querySelector('pre').textContent = error?.message || String(error || 'Error de carga')
          root.querySelector('button').addEventListener('click', () => window.location.reload())
        }
        window.addEventListener('error', event => showStartupFallback(event.error || event.message))
        window.addEventListener('unhandledrejection', event => showStartupFallback(event.reason))
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
